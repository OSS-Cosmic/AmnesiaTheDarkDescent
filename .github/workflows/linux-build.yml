name: Linux Build

on:
  workflow_call:
    inputs:
      config:
        description: 'Build configuration: release or debug'
        type: string
        default: 'release'
      premake_args:
        description: 'Additional arguments forwarded to `premake5 gmake2`'
        type: string
        default: ''
        required: false
      name_suffix:
        description: 'Optional suffix appended to the job and artifact names'
        type: string
        default: ''
        required: false
      build_version:
        description: 'Version embedded in the game and displayed in the main menu'
        type: string
        default: 'V0000'
        required: false

jobs:
  linux:
    name: "linux-x86_64-${{ inputs.config }}${{ inputs.name_suffix }}"
    runs-on: ubuntu-24.04
    env:
      CONFIG_NAME: "linux-x86_64-${{ inputs.config }}${{ inputs.name_suffix }}"
      # premake's cfg.buildcfg is capitalized; gmake2's `config=` is lowercase.
      BUILD_FOLDER: "${{ inputs.config == 'release' && 'Release' || 'Debug' }}"
      BUILD_VERSION: ${{ inputs.build_version }}
      # Keep in sync with the ARG in the repo-root Dockerfile.
      PREMAKE_VERSION: "5.0.0-beta8"
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # libwayland-dev/libdbus-1-dev are load-bearing: SDL2's CMake auto-enables
      # those backends and hard-fails when the headers are missing. cmake is
      # required even though this is not a CMake project -- SDL2 and openal-soft
      # are built by driving their own CMake (premake/external.lua).
      # glslang-tools, spirv-tools, and python3 are required by the FSR SDK
      # shader-compiler wrapper and its SPIR-V validation scripts.
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ninja-build cmake python3 glslang-tools spirv-tools zip \
            libx11-dev libxext-dev libxi-dev libxcursor-dev libxrandr-dev libxss-dev \
            libgl-dev libglu1-mesa-dev libegl1-mesa-dev \
            libwayland-dev libxkbcommon-dev libdecor-0-dev \
            libasound2-dev libpulse-dev libdbus-1-dev libsamplerate0-dev \
            libudev-dev \
            liblcms2-dev

      - name: Install premake5
        run: |
          curl -fsSL -o /tmp/premake.tar.gz \
            "https://github.com/premake/premake-core/releases/download/v${PREMAKE_VERSION}/premake-${PREMAKE_VERSION}-linux.tar.gz"
          sudo tar -xzf /tmp/premake.tar.gz -C /usr/local/bin premake5
          sudo chmod +x /usr/local/bin/premake5
          premake5 --version

      # premake5 downloads the pinned prebuilt slangc at configure time.
      - name: Cache slangc
        uses: actions/cache@v4
        with:
          path: build-premake/_deps/slang-prebuilt
          key: slang-${{ runner.os }}-${{ hashFiles('premake/slang.lua') }}

      - name: Generate makefiles
        run: premake5 gmake2 "--build-version=$BUILD_VERSION" ${{ inputs.premake_args }}

      - name: Build
        run: make -C build-premake config=${{ inputs.config }} -j"$(nproc)"

      # Copy/staging steps only fail on a rebuild over an existing destination;
      # a single cold build cannot catch that. Re-running this target costs
      # seconds instead of running a second full build.
      - name: Rebuild FSR external (incremental)
        run: make -C build-premake config=${{ inputs.config }} FsrSdkExternal

      - name: Rebuild FSR runtime staging (incremental)
        run: make -C build-premake config=${{ inputs.config }} FsrRuntimeGame

      # The engine dlopen's this module instead of linking it, so neither a
      # missing file nor an empty export table is a build error -- both just turn
      # FSR off at runtime. There is no D3D12 module on Linux.
      - name: Assert FSR module deployed and exported
        run: |
          set -euo pipefail
          module="build-premake/amnesia/${BUILD_FOLDER}/libs/libffx_fsr3upscaler_api_vk.so"
          test -f "$module" || { echo "FSR runtime module was not deployed: $module"; exit 1; }
          # ffx-api's ffx_api.h decorates these with FFX_API_ENTRY, which
          # cmake/fsr/patches/portable_ffx_api.cmake maps to
          # visibility("default") on non-MSVC. A module that builds but exports
          # nothing is indistinguishable from a healthy one until dlsym fails.
          for symbol in ffxCreateContext ffxDestroyContext ffxConfigure ffxQuery ffxDispatch; do
            nm -D --defined-only "$module" | grep -qE " T ${symbol}\$" \
              || { echo "FSR module does not export ${symbol}"; exit 1; }
          done
          # CXX_VISIBILITY_PRESET hidden should leave exactly those five, so the
          # module cannot be interposed by the executable's volk or its copy of
          # ffxGetPermutationBlobByIndex.
          exported=$(nm -D --defined-only "$module" | grep -cE " T " || true)
          test "$exported" -eq 5 \
            || { echo "unexpected FSR module export count: $exported (want 5)"; nm -D --defined-only "$module" | grep -E " T "; exit 1; }

      - name: Package
        run: |
          tar --exclude='*.a' -zcf "${CONFIG_NAME}.tar.gz" \
            -C "build-premake/amnesia/${BUILD_FOLDER}" .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.CONFIG_NAME }}
          path: ${{ env.CONFIG_NAME }}.tar.gz
          # Release keeps DWARF symbols (premake5.lua: symbols "On"), so this
          # archive is ~570MB. Expire it quickly to stay inside the storage quota.
          retention-days: 7
