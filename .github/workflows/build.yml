name: Build

on:
  pull_request:
  push:
    branches:
      - main

# A full cold build of the engine + SDL2 + openal-soft is expensive; don't let
# superseded pushes on the same ref pile up.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    uses: ./.github/workflows/linux-build.yml
    with:
      config: release

  windows:
    uses: ./.github/workflows/windows-build.yml
    with:
      config: release
